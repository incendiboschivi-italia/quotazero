<header className="sticky z-20 px-4 pt-3 pb-3 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-900" style=${{top:'env(safe-area-inset-top,0px)'}}>
<div className="flex items-center gap-2.5"><span className="grid place-items-center w-8 h-8 rounded-xl bg-orange-500 text-zinc-950"><${Ic} n="Mountain" s=${18}/></span><b className="text-lg font-extrabold tracking-tight">Quota<span className="text-orange-500">Zero</span></b><span className="ml-auto"></span><button className="pill !py-1.5" onClick=${()=>openEd('new')}><${Ic} n="Plus" s=${14}/> Nuovo</button><button aria-label="Impostazioni Cloud" className=${'grid place-items-center w-9 h-9 rounded-xl border border-zinc-800 bg-zinc-900 '+(sb?'text-orange-500':'text-zinc-400')} onClick=${()=>setCm(true)}><${Ic} n=${sb?'Cloud':'CloudOff'} s=${18}/></button></div>
<div className="relative mt-3"><div className="w-full rounded-2xl bg-zinc-900 border border-zinc-800 pl-3.5 pr-2 py-2.5 flex items-center gap-1.5"><button aria-label="Scegli itinerario" aria-expanded=${pk} className="flex-1 min-w-0 text-left flex items-center gap-2" onClick=${()=>setPk(!pk)}><div className="flex-1 min-w-0"><div className="font-bold truncate">${it.name}</div><div className="text-xs text-zinc-400 truncate">${it.zone}</div><div className="flex flex-wrap gap-1.5 mt-2">${[['Route',tot.km.toFixed(1)+' km'],['TrendingUp','D+ '+tot.dp+' m'],['Clock',fh(tot.t)]].map(([n,t])=>h`<span key=${n} className="inline-flex items-center gap-1 rounded-full bg-zinc-800 px-2 py-0.5 text-[11px] font-semibold text-zinc-200"><${Ic} n=${n} s=${11}/>${t}</span>`)}</div></div><${Ic} n="ChevronDown" s=${18} c=${'text-zinc-400 transition '+(pk?'rotate-180':'')}/></button><button aria-label="Modifica itinerario" title="Modifica" className="grid place-items-center w-9 h-9 shrink-0 rounded-xl bg-zinc-800 text-zinc-200" onClick=${()=>openEd('edit')}><${Ic} n="Pencil" s=${16}/></button></div>
${pk&&h`<div className="absolute z-30 left-0 right-0 mt-1.5 rounded-2xl bg-zinc-900 border border-zinc-800 shadow-2xl overflow-hidden">${its.map((x,i)=>h`<button key=${i} className=${'w-full text-left px-3.5 py-2.5 border-b border-zinc-800 last:border-0 '+(i===ci?'bg-zinc-800':'')} onClick=${()=>{pickIt(i);setPk(false)}}><div className="font-semibold text-sm">${x.name}</div><div className="text-xs text-zinc-400">${x.zone}${x.cloudId?' · ☁':''}</div></button>`)}<button className="w-full text-left px-3.5 py-3 text-sm font-bold text-orange-500 flex items-center gap-2 bg-zinc-950/60" onClick=${()=>{setPk(false);openEd('new')}}><${Ic} n="Plus" s=${16}/> Nuovo itinerario</button></div>`}</div>
</header>
${msg&&h`<div role="status" className="mx-4 mt-3 rounded-xl bg-zinc-800 border border-orange-500/40 text-zinc-100 text-sm font-medium px-3.5 py-2.5">${msg}</div>`}
<main className="flex-1 p-4 pb-24 space-y-3">
${tab===0&&h`<div className="space-y-3">
<div className="flex gap-2 flex-wrap"><button className=${'ch '+(sel<0?'on':'')} onClick=${()=>setSel(-1)}>Tutto</button>${ds.map((d,i)=>h`<button key=${i} className=${'ch '+(sel===i?'on':'')} onClick=${()=>setSel(i)}><span style=${{color:sel===i?'#0f172a':DC[i%5]}}>●</span> G${i+1}</button>`)}</div>
<div className="cd !p-0 overflow-hidden"><${MapV} it=${it} sel=${sel} wp=${wp} setWp=${setWp}/>
<div className="flex flex-wrap gap-x-3 gap-y-1 text-xs mu mt-2.5 px-3.5">${[['r','Rifugio'],['b','Bivacco'],['t','Tenda'],['w','Acqua'],['p','Passo/vetta']].map(([k,l])=>h`<span key=${k}><span style=${{color:TC[k]}}>●</span> ${l}</span>`)}</div>
<p className="text-[11px] mu mt-1 px-3.5 pb-3">Mappa vettoriale offline: le tile di OpenTopoMap non sono caricabili in questo ambiente.</p></div>
<div className="cd text-sm">${wpd?h`<b>${wpd.n}</b> · ${wpd.ele} m · Giorno ${wp.d+1}${wpd.t&&SL[wpd.t]?' · '+SL[wpd.t]:''}<div className="mu text-xs mt-1">${wpd.lat.toFixed(4)}°N, ${wpd.lon.toFixed(4)}°E</div>`:h`<span className="mu">Tocca un waypoint sulla mappa per i dettagli.</span>`}</div>
<div className="rounded-2xl bg-zinc-900 border border-zinc-800 p-2.5 space-y-2"><div className="flex gap-1.5 overflow-x-auto"><label className="pill cursor-pointer"><${Ic} n="Upload" s=${15}/> Importa GPX<input type="file" accept=".gpx,application/gpx+xml,text/xml" className="hidden" onChange=${onFile}/></label>
<button className="pill" onClick=${()=>save(slug+'.gpx',gpx(it),slug+'.gpx.txt')}><${Ic} n="Download" s=${15}/> Esporta GPX</button>
<button className="pill" title="Salva nel cloud" onClick=${toCloud} disabled=${busy}><${Ic} n="Cloud" s=${15}/> ${busy?'…':it.cloudId?'Aggiorna':'Salva'}</button></div>
<div className="flex items-center gap-1.5 overflow-x-auto"><span className="flex items-center gap-1 text-[11px] font-semibold uppercase tracking-wide text-zinc-500 pl-1 pr-0.5"><${Ic} n="Clock" s=${12}/> Tempi</span>${[['cai','CAI'],['munter','Munter']].map(([k,l])=>h`<button key=${k} className=${'pill '+(method===k?'pon':'')} onClick=${()=>setMethod(k)}>${l}</button>`)}${method==='munter'&&[3,4,5,6].map(v=>h`<button key=${v} className=${'pill '+(speed===v?'pon':'')} onClick=${()=>setSpeed(v)}>${v} km/h</button>`)}</div></div>
<div className="cd"><div className="font-bold mb-1 flex items-center gap-1.5"><${Ic} n="Route" s=${16}/> Profilo altimetrico</div><${Prof} it=${it}/>
<div className="grid grid-cols-3 text-center text-sm mt-2"><div><b>${tot.dp} m</b><div className="mu text-xs">D+</div></div><div><b>${tot.dm} m</b><div className="mu text-xs">D−</div></div><div><b>${fh(tot.t)}</b><div className="mu text-xs">marcia</div></div></div></div></div>`}
${tab===1&&h`<div className="space-y-3">
<div className="cd space-y-2"><div className="font-bold flex items-center gap-1.5"><${Ic} n="Clock" s=${16}/> Metodo di calcolo dei tempi</div>
<div className="grid grid-cols-2 gap-1.5">${[['cai','CAI'],['munter','Munter']].map(([k,l])=>h`<button key=${k} className=${'ch '+(method===k?'on':'')} onClick=${()=>setMethod(k)}>${l}</button>`)}</div>
${method==='munter'?h`<div><div className="text-xs mu mb-1">Velocità di marcia (km-sforzo ÷ km/h)</div><div className="grid grid-cols-4 gap-1.5">${[[3,'Difficile'],[4,'Sentiero'],[5,'Veloce'],[6,'Trail']].map(([v,l])=>h`<button key=${v} className=${'ch leading-tight '+(speed===v?'on':'')} onClick=${()=>setSpeed(v)}>${v} km/h<div className="text-[10px] font-normal">${l}</div></button>`)}</div><p className="text-xs mu mt-1">km-sforzo = km + D+/100. Usa 3 km/h con neve, terreno difficile o zaino pesante.</p></div>`:h`<p className="text-xs mu">Orizzontale: 3,5 km/h (T/E), 2,5–3 km/h (EE/EEA). Verticale: +300/350 m/h in salita, −400/500 m/h in discesa. Tempo = valore maggiore + metà del minore. Il tempo mostrato è il valore centrale, con intervallo veloce–prudente.</p>`}</div>
${ds.map((d,i)=>h`<div key=${i} className="cd space-y-2" style=${{borderLeft:'6px solid '+DC[i%5]}}>
<div className="flex items-start gap-2"><div className="flex-1"><b>Giorno ${i+1}</b><div className="text-sm mu">${nm(d,i)}</div></div><${TimeBox} d=${d}/>
${ds.length>1&&h`<button aria-label="Elimina giorno" className="p-1.5 rounded-lg bd" onClick=${()=>setDays(a=>a.filter((_,j)=>j!==i))}><${Ic} n="Trash2" s=${15}/></button>`}</div>
<${Info} d=${d}/>
<div className="grid grid-cols-3 gap-2 text-xs mu">${[['km','Distanza km'],['dp','D+ (m)'],['dm','D− (m)']].map(([k,l])=>h`<label key=${k}>${l}<input type="number" min="0" step=${k==='km'?'0.1':'10'} value=${d[k]} onChange=${e=>upd(i,{[k]:+e.target.value})}/></label>`)}</div>
<div><div className="text-xs mu mb-1">Difficoltà CAI · ${CAI[d.cai]}</div><div className="flex gap-1.5">${Object.keys(CAI).map(c=>h`<button key=${c} className=${'ch flex-1 '+(d.cai===c?'on':'')} onClick=${()=>upd(i,{cai:c})}>${c}</button>`)}</div></div>
<div><div className="text-xs mu mb-1 flex items-center gap-1"><${Ic} n="Droplets" s=${13}/> Punti acqua</div><div className="flex flex-wrap gap-1.5">${d.water.map((w,j)=>h`<button key=${j} className="ch text-xs" onClick=${()=>upd(i,{water:d.water.filter((_,a)=>a!==j)})}>${w} ×</button>`)}<button className="ch text-xs" onClick=${()=>upd(i,{water:[...d.water,'Sorgente']})}>+ aggiungi</button></div></div>
<div><div className="text-xs mu mb-1">Pernottamento</div><div className="grid grid-cols-2 gap-1.5">${[[null,'Nessuno (rientro)'],['r','Rifugio custodito'],['b','Bivacco fisso'],['t','Tenda / libero']].map(([k,l])=>h`<button key=${l} className=${'ch '+(d.sleep===k?'on':'')} onClick=${()=>upd(i,{sleep:k})}>${l}</button>`)}</div>
${d.sleep&&h`<input className="mt-2" aria-label="Nome struttura" placeholder="Nome struttura / luogo" value=${d.sn} onChange=${e=>upd(i,{sn:e.target.value})}/>`}
${d.sleep==='b'&&h`<p className="text-xs mu mt-1">Non gestito: nessuna garanzia di posti, coperte o acqua. Porta sacco a pelo e un’alternativa.</p>`}
${d.sleep==='t'&&h`<p className="text-xs mu mt-1">Verifica i divieti di bivacco e campeggio libero dell’area (parchi, quote, regolamenti locali).</p>`}</div></div>`)}
${ds.length<5&&h`<${Btn} c="bg-orange-500 text-slate-950 w-full" onClick=${()=>setDays(a=>[...a.map((d,i)=>i===a.length-1&&!d.sleep?{...d,sleep:'r'}:d),{km:10,dp:600,dm:600,cai:'E',sleep:null,sn:'',water:[],esc:['Definisci la via di fuga per questa tappa.'],pts:[]}])}><${Ic} n="Plus" s=${16}/> Aggiungi giorno<//>`}</div>`}
${tab===2&&h`<div className="space-y-3">
<div className="cd"><div className="font-bold mb-1 flex justify-between"><span><${Ic} n="Backpack" s=${16} c="inline mr-1"/>Checklist zaino</span><span className="mu text-sm">${[...base,...extras].filter(x=>ck[x]).length}/${base.length+extras.length}</span></div>
${extras.length>0&&h`<div className="text-xs font-bold text-orange-500 mt-2">AGGIUNTI AUTOMATICAMENTE · ${ds.length>1?ds.length+' giorni':''}</div>`}
${extras.map(x=>h`<label key=${x} className="flex items-center gap-2 py-1.5 text-sm"><input type="checkbox" className="!w-5 !h-5" checked=${!!ck[x]} onChange=${()=>setCk({...ck,[x]:!ck[x]})}/>${x}</label>`)}
<div className="text-xs font-bold mu mt-2">BASE</div>
${base.map(x=>h`<label key=${x} className="flex items-center gap-2 py-1.5 text-sm"><input type="checkbox" className="!w-5 !h-5" checked=${!!ck[x]} onChange=${()=>setCk({...ck,[x]:!ck[x]})}/>${x}</label>`)}</div>
<div className="cd"><div className="font-bold mb-2 flex items-center gap-1.5"><${Ic} n="ShieldAlert" s=${16}/> Scheda sicurezza e piano B</div>
<label className="text-xs mu">Data di partenza<input type="date" value=${dt} onChange=${e=>e.target.value&&setDt(e.target.value)}/></label></div>
${ds.map((d,i)=>{const x=wx(d);return h`<div key=${i} className="cd text-sm space-y-1.5" style=${{borderLeft:'6px solid '+DC[i%5]}}><b>Giorno ${i+1}</b> <span className="mu">· quota max ${x.mxE} m</span>
<div className="flex gap-4"><span className="flex items-center gap-1"><${Ic} n="Sunrise" s=${15}/> ${x.sr}</span><span className="flex items-center gap-1"><${Ic} n="Sunset" s=${15}/> ${x.ss}</span></div>
<div className="mu">Temperatura stimata: ${(d.pts[0]?d.pts[0].ele:0)} m → <b>${x.t(d.pts[0]?d.pts[0].ele:0)} °C</b> · ${x.mxE} m → <b>${x.t(x.mxE)} °C</b>${x.iso?' · isoterma 0 °C a ~'+x.iso+' m':''}</div>
<div><b>Vie di fuga</b><ul className="list-disc pl-5 mu">${d.esc.map((v,j)=>h`<li key=${j}>${v}</li>`)}</ul></div></div>`})}
<p className="text-xs mu">Orari di alba e tramonto calcolati per la data scelta. Il meteo per quota è una stima da gradiente termico (−6,5 °C/km), non una previsione: consulta il bollettino ufficiale prima di partire. Itinerari e coordinate sono dimostrativi.</p>
<${Btn} c="bg-orange-500 text-slate-950 w-full" onClick=${()=>save('scheda-sicurezza-'+slug+'.html',sheet())}><${Ic} n="FileText" s=${16}/> Esporta scheda da lasciare a casa<//></div>`}
</main>
<nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md grid grid-cols-3 z-20 backdrop-blur-md bg-zinc-900/90 border-t border-zinc-800" style=${{paddingBottom:'env(safe-area-inset-bottom,0px)'}}>
${[['Map','Pianifica & Mappa'],['Tent','Tappe & Bivacchi'],['Backpack','Zaino & Sicurezza']].map(([n,l],i)=>h`<button key=${i} onClick=${()=>setTab(i)} aria-current=${tab===i} className=${'relative flex flex-col items-center gap-1 pt-3 pb-2 text-[11px] font-semibold '+(tab===i?'text-orange-500':'text-zinc-400')}>${tab===i&&h`<span className="absolute top-0 h-0.5 w-10 rounded-full bg-orange-500"></span>`}<${Ic} n=${n} s=${22}/>${l}</button>`)}</nav>${modal}${editor}</div>`}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script></body></html>
